Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Info
# Only containers on the internal Docker network may use the proxy.
Allow 172.30.77.0/24
# HTTPS tunnels only, to port 443 only.
ConnectPort 443
# Deny every host not listed in the filter file.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/filter"
