Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Info
# Only containers on the private Docker networks may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS tunnels only, to port 443 only.
ConnectPort 443
# Deny every host not listed in the filter file.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/filter"
